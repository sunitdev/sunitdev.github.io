[project]
name = "playground"
version = "0.1.0"
description = "Shared Python environment for notebooks and AI experiments"
requires-python = ">=3.14,<3.15"
dependencies = ["math-tools", "ai-algorithms"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["apps/blog"]

[tool.uv.sources]
math-tools = { workspace = true }
ai-algorithms = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.14,<1"]
notebooks = ["jupyterlab>=4.4,<5", "ipykernel>=7,<8"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
